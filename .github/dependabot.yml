# Updates of the dependencies as pull requests: once a week, the minor and patch updates of npm
# in one pull request, majors one by one; the GitHub Actions once a month.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
