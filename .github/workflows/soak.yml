name: Soak

# The long test of the app's memory (NF-06), started by hand: Actions → Soak → Run workflow.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of playing
        default: '60'

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:soak
        env:
          SOAK_MINUTES: ${{ inputs.minutes }}
