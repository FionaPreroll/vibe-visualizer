name: CI

on:
  # Branches are checked in their pull requests, and main after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request stops the run for the commit before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ubuntu 24.04 rather than ubuntu-latest: the jobs install browsers and their system packages
# (the Firefox job also a display and a sound server), which a new Ubuntu may change. Move on
# to a newer one on purpose.
jobs:
  # Types, lint, formatting and the unit tests.
  static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Codecov takes the coverage signed in with GitHub's OIDC token: no secret to keep.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      # The unit tests' coverage, for the badge in the README. An upload that fails does not
      # fail the checks.
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true

  # The end-to-end tests in Chromium, in four jobs at once. Each runner draws in software and
  # runs its tests one at a time; the exports take more than half of the time, so they have
  # two jobs of their own, split by how long the tests took on CI. Each pair of filters is
  # complementary, so every test runs once: the exports in two parts; the other files in two
  # halves.
  e2e:
    name: e2e (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: exports, 1 of 2
            args: tests/e2e/export.spec.ts --grep "tracks of the queue|resumes after a reload"
          - part: exports, 2 of 2
            args: tests/e2e/export.spec.ts --grep-invert "tracks of the queue|resumes after a reload"
          - part: the rest, 1 of 2
            args: --grep-invert "export\.spec" --fully-parallel --shard=1/2
          - part: the rest, 2 of 2
            args: --grep-invert "export\.spec" --fully-parallel --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e ${{ matrix.args }}
      # When a test fails, the log shows what its page showed.
      - if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \;

  # The check main requires (with firefox): the types, the unit and the end-to-end tests.
  check:
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.e2e.result }}" = success

  # The second browser (NF-02): the main paths, in a job of their own.
  firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox
      # Firefox gets a virtual display: headless, it has no WebGL without a GPU.
      - run: command -v xvfb-run || sudo apt-get install -y xvfb
      # And a sound server with a silent output: without one, its audio never starts.
      - run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - run: xvfb-run --auto-servernum pnpm test:e2e:firefox
        env:
          PW_FIREFOX_DISPLAY: '1'
      # When a test fails, the log shows what its page showed.
      - if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \;
