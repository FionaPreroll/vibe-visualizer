name: CI

on:
  # Branches are checked in their pull requests, and main after each merge.
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request stops the run for the commit before.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ubuntu 24.04 rather than ubuntu-latest: the jobs install browsers and their system packages
# (the Firefox job also a display and a sound server), which a new Ubuntu may change. Move on
# to a newer one on purpose.
jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Codecov takes the coverage signed in with GitHub's OIDC token: no secret to keep.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      # The unit tests' coverage, for the badge in the README. An upload that fails does not
      # fail the checks.
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # The second browser (NF-02): the main paths, in a job of their own.
  firefox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps firefox
      # Firefox gets a virtual display: headless, it has no WebGL without a GPU.
      - run: command -v xvfb-run || sudo apt-get install -y xvfb
      # And a sound server with a silent output: without one, its audio never starts.
      - run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=silent
          pactl set-default-sink silent
      - run: xvfb-run --auto-servernum pnpm test:e2e:firefox
        env:
          PW_FIREFOX_DISPLAY: '1'
      # When a test fails, the log shows what its page showed.
      - if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \;
